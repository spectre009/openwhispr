# How `git upstream report` reads OpenWhispr/openwhispr for this fork (Cortex gitpush, upstreamreport.ts).
# Read from the working tree, so an edit shows in the next report.

name = "OpenWhispr"
platform = "windows"
version_file = "package.json"
version_pattern = '"version":\s*"([^"]+)"'
release_tags = "v*"
# Never user-facing on their own: CI, docs, examples, the mobile app (this fork ships the desktop app only), build
# scripts and tests.
internal_paths = [".github/", ".oss-scanner/", "docs/", "examples/", "openwhispr-mobile/", "scripts/", "test/", "*.md"]

# Conventional-commit scopes and top-level folders, by the name a user knows them.
[areas]
agent = "Voice Assistant"
assistant = "Voice Assistant"
selection = "Voice Assistant"
chat = "Chat"
chats = "Chat"
ai = "Chat"
mobile = "Mobile app"
openwhispr-mobile = "Mobile app"
connectors = "Connectors"
integrations = "Connectors"
slack = "Connectors"
notes = "Notes"
meetings = "Meetings"
calendar = "Meetings"
sync = "Sync"
auth = "Account"
billing = "Account"
workspaces = "Workspaces"
spaces = "Workspaces"
teams = "Workspaces"
guests = "Workspaces"
policy = "Enterprise"
enterprise = "Enterprise"
dictation = "Dictation"
hotkeys = "Hotkeys"
transcription = "Speech-to-text"
streaming = "Speech-to-text"
whisper = "Speech-to-text"
deepgram = "Speech-to-text"
orukeet = "Speech-to-text"
tinfoil = "Speech-to-text"
reasoning = "Cleanup"
tone-style = "Cleanup"
llama = "Local models"
models = "Models"
groq = "Models"
dictionary = "Dictionary"
settings = "Settings"
onboarding = "Onboarding"
permissions = "Onboarding"
ui = "Look and feel"
window = "Look and feel"
linux = "Linux"
nix = "Linux"
macos = "macOS"
windows = "Windows"
deps = "Dependencies"
release = "Release"
changelog = "Release"
security = "Security"
startup = "Startup"
native = "Native helpers"
resources = "Native helpers"
src = "App"

# Title words win, first match first; then the folder with the most changed lines.
[[area]]
name = "Meetings"
words = ["meeting", "meetings", "speaker", "speakers", "Speaker ID", "diarization"]

[[area]]
name = "Notes"
words = ["AI Summary", "Detailed Notes", "note", "notes"]

[[area]]
name = "Speech-to-text"
words = ["Orukeet", "Parakeet", "speech-to-text", "transcription provider"]

[[area]]
name = "Voice Assistant"
words = ["Voice Assistant", "assistant panel", "modal pill"]

[[area]]
name = "Mobile app"
paths = ["openwhispr-mobile/"]

[[area]]
name = "Connectors"
paths = ["src/helpers/connectors/"]

# What this fork changed in upstream code, and how to tell it still works after a merge. A feature's files are the
