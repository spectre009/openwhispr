# What we track that isn't fork code: overlaps, wishes, open leads. Matches are evidence for the digest's For us table.
[[watch]]
name = "Account-scoped history and dictionary"
issues = [2924]
words = ["scope transcriptions", "scoped to the account", "account scoping"]
note = "Our step history, reviews, test set and dictionary state are scoped to step history's owner; upstream now scopes transcriptions, chats, dictionary and snippets to the account, with a database migration"
check = "After the merge, the dev copy migrates a copy of Stable's database; sign out and in: History, its steps and reviews, the Dictionary's pins and categories and the test set show the right account's rows"

[[watch]]
name = "OpenRouter speech-to-text"
issues = [2105, 3016]
words = ["OpenRouter"]
note = "Upstream adds OpenRouter as a speech-to-text provider; our one speech-to-text picker and AI Connections must list it"
check = "Recognition's picker lists OpenRouter's speech models; a dictation through one transcribes; AI Connections checks the key"

[[watch]]
name = "Workspaces, teams and guests in Settings"
words = ["workspace", "workspaces", "teamspace", "teamspaces", "guests", "teams", "People page"]
note = "Upstream adds People, Teams and Workspace settings; our Settings layer replaced the old sections, so each new section needs a page in settingsPages.ts and search entries"
check = "Every new upstream settings section is reachable from our Settings menu and from search"

[[watch]]
name = "Microphone listing starts the video capture service"
issues = [3098]
words = ["default-mic", "enumerateDevices", "mic lookup", "microphone list"]
note = "Listing microphones at startup starts Chromium's video capture service (68 MB private), which never exits; we'd like the listing deferred or done in main"
check = "Settings > Processes & resources after a fresh start: is the Video capture service still listed?"

[[watch]]
name = "Toast and error card design"
issues = [3051]
words = ["toast", "toasts", "error card"]
note = "Our dictation error cards stay until dismissed and offer Open in History and Retry; upstream redesigned every toast after the error card"
check = "Fail a dictation (wrong key): the card stays, Open in History and Retry work"

[[watch]]
name = "Hold-to-talk start latency (Windows)"
issues = [2977]
words = ["push-to-talk", "hold to speak", "native listener", "native listeners", "start latency"]
note = "We trace press to recording (13fbdfe) and run one key listener per style hotkey (195aaec); upstream changes when native listeners start"
check = "Hold the dictation hotkey and a style hotkey: both record at once; the 'Dictation start trace' line shows press to recording under 300 ms"

[[watch]]
name = "Brand fonts download without network"
files = ["scripts/download-brand-fonts.js"]
note = "A network error fails the dev start; we'd like it to skip as it does without repo access"
check = "With the network off, npm run dev starts"

[[watch]]
name = "Memory held while idle"
words = ["memory leak", "memory usage", "renderer memory", "unload"]
note = "Idle Stable holds about 1 GB private across 8 processes; the hidden control panel keeps its renderer (about 150 MB) and the GPU process keeps about 450 MB after a full-frame edge strip"
check = "Settings > Processes & resources: compare In RAM and graphics memory with the last snapshot line in the log"

[[watch]]
name = "Copilot or Azure Speech upstream"
words = ["GitHub Copilot", "Copilot SDK", "Azure Speech", "MAI-Transcribe"]
note = "Our GitHub Copilot provider and Azure Speech (MAI-Transcribe-2) are fork features; if upstream adds either, take theirs or reconcile"
